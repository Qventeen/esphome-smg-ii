substitutions:
  name: anenji
  device_description: "Anenji ESP32c3"
  tx_pin: GPIO04
  rx_pin: GPIO03

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}


esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret anenji_api_encription_key

# Enable ota
ota:
  - platform: esphome
    password: !secret anenji_ota_password

# Use wifi connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: none
  fast_connect: true

web_server:
  port: 8080
  auth:
    username: !secret anenji_web_server_username
    password: !secret anenji_web_server_password

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 20s

time:
  - platform: sntp

# Sensors
sensor:
# Device Type	 	UInt	171	1	R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Device Type"
    address: 171
    entity_category: diagnostic
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0

  # Protocol Number	 	UInt	184	1	R	The protocol number of this protocol is 0x02
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Protocol Number"
    address: 171
    entity_category: diagnostic
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
