    entity_category: config
    icon: mdi:battery-low
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum charging current                                      0.1A    Uint  332 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} 02 Maximum charging current" #PV+Utility
    use_write_multiple: true
    address: 332
    register_type: holding
    value_type: U_WORD
    min_value: 20.0  #program 05 (now 20A| min 5A)
    max_value: 100.0 #max PV+Utility
    step: 1
    unit_of_measurement: "A"
    entity_category: config
    icon: mdi:current-dc
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum mains charging current                                0.1A    Uint  333 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} 11 Maximum mains charging current"
    use_write_multiple: true
    address: 333
    register_type: holding
    value_type: U_WORD
    min_value: 5.0   #min utility 5.0
    max_value: 60.0  #program 02 || < max 60.0
    step: 1
    unit_of_measurement: "A"
    entity_category: config
    icon: mdi:battery-charging
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Equalization section
  ###########################################
  
  # Eq Charging voltage                                           0.1V    Uint  334 1 R/W
