    min_value: 0.0                #TODO: check and setup this params 
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    entity_category: config
    icon: mdi:battery-low
    lambda: "return x * 0.1f;"
    write_lambda: |-
