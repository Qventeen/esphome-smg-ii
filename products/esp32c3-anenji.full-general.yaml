    modbus_controller_id: smg0
    name: "${name} 27 Floating charging voltage"
    use_write_multiple: true
    address: 325
    register_type: holding
    value_type: U_WORD
    min_value: 53.3 #48.0 | real 53.3 less floating don't starts
    max_value: 55.5 #program 26 | my bulk charge 55.5
    step: 0.1
    unit_of_measurement: "V"
    entity_category: config
    icon: mdi:battery
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery discharge recovery point in mains mode                0.1V    Uint  326 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} 12 Battery discharge recovery point in mains mode"
    use_write_multiple: true
    address: 326
