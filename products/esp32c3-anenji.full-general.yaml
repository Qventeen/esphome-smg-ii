# I have gotten this config from https://github.com/kodxpl/esphome-anenji/blob/main/esp32-anenji.yaml
substitutions:
  name: anenji
  device_description: "Anenji ESP32c3"
  tx_pin: GPIO04
  rx_pin: GPIO03

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret anenji_api_encription_key

# Enable ota
ota:
  - platform: esphome
    password: !secret anenji_ota_password

# Use wifi connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: none
  fast_connect: true

web_server:
  port: 8080
  auth:
    username: !secret anenji_web_server_username
    password: !secret anenji_web_server_password

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 10s

time:
  - platform: sntp

sensor:
  # Derived sensors
  ##############################

  # PV energy today
  # - platform: total_daily_energy
  #   name: "${name} PV energy today"
  #   restore: true
  #   icon: mdi:counter
  #   power_id: smg0_pv_average_power
  #   filters:
  #     # Multiplication factor from W to kW is 0.001
  #     - multiply: 0.001
  #   unit_of_measurement: kWh
  
  # Battery discharte today
  - platform: total_daily_energy
    name: "${name} Battery discharge today"
    restore: true
    device_class: energy
    power_id: smg0_discharging_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh

  # Battery charge today
  - platform: total_daily_energy
    name: "${name} Battery charge today"
    restore: true
    device_class: energy
    power_id: smg0_charging_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh

  # Discharging power
  - platform: template
    name: "${name} Discharging power"
    id: smg0_discharging_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:battery-arrow-down
    # Gets updated on value of smg0_battery_average_power
    update_interval: never
    lambda: |-
      if (isnan(id(smg0_battery_average_power).state)) {
        return {};
      }
      auto power = id(smg0_battery_average_power).state;
      return (power < 0.0f) ? -power : 0.0f;

  # Charging power
  - platform: template
    name: "${name} Charging power"
    id: smg0_charging_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    icon: mdi:battery-charging
    # Gets updated on value of smg0_battery_average_power
    update_interval: never
    lambda: |-
      if (isnan(id(smg0_battery_average_power).state)) {
        return {};
      }
      auto power = id(smg0_battery_average_power).state;
      return (power > 0.0f) ? power : 0.0f;
  ##############################

  # Device section
  ############################
  # Device Type	 	       UInt	171	1	R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Device type"
    address: 171
    entity_category: diagnostic
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0

  # Protocol Number	 	UInt	184	1	R	The protocol number of this protocol is 0x02
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Protocol number"
    address: 184
    entity_category: diagnostic
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
  ############################


  # Effective mains voltage                              0.1V     Int   202 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Main voltage" # AC voltage
    address: 202
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Mains Frequency                                      0.01Hz   Int   203 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Main frequency" # AC Frequency
    address: 203
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
