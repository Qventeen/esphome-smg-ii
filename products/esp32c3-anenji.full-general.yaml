number:
  # Output voltage                                               0.1V    Uint  320 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} 08 Output voltage" #TODO: change to select 220 230 240
    use_write_multiple: true
    address: 320
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    entity_category: config
    icon: mdi:cog
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Output frequency setting                                      0.01Hz  Uint  321 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} 09 Output frequency" #TODO: change to select 50 60
    use_write_multiple: true
    address: 321
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.01
    unit_of_measurement: "Hz"
    entity_category: config
    icon: mdi:cog
    lambda: "return x * 0.01f;"
    write_lambda: |-
      return x * 100.0f;

  # [A] Battery overvoltage protection point                          0.1V    Uint  323 1 R/W
  # Range: ( B + 1v * J ) ~ 16.5v * J
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Battery overvoltage protection"
    use_write_multiple: true
    address: 323
    register_type: holding
