substitutions:
  name: anenji #префікс сутностей інвертора
  name_jk: jk_bms #префікс сутностей JK BMS
  external_components_source: github://syssi/esphome-jk-bms@main
  mac_address: A4:C1:38:02:4B:EE
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  protocol_version: JK02_32S

esphome:
  name: hybrid-c3
  friendly_name: Anenji JK Adapter
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

uart:
  - id: anenji_uart
    baud_rate: 9600
    tx_pin: GPIO04
    rx_pin: GPIO03
    rx_buffer_size: 512

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Kyiv

modbus:
  - id: anenji_modbus
    uart_id: anenji_uart
    send_wait_time: 350ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: anenji_modbus
    command_throttle: 130ms
    update_interval: 6s

select:
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg_input_voltage_range
    name: "${name} input voltage range"
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    optionsmap:
      "Apply": 0
      "UPS": 1
      "GEN": 2

  - platform: modbus_controller
    modbus_controller_id: smg0
    id: battery_type_select
    name: "${name} battery type"
    use_write_multiple: true
    address: 322
    value_type: U_WORD
    optionsmap:
      "AGM": 0
      "FLD": 1
      "User": 2
      #"Li_1": 3
      "Li_2": 4
      #"Li_3": 5
      "Li_4": 6

  # Output priority                                               Uint  301 1 R/W 0: Utility-PV-Battery, 1: PV-Utility-Battery, 2: PV-Battery-Utility
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} output priority"
    id: smg_output_priority
    use_write_multiple: true
    address: 301
    value_type: U_WORD
    optionsmap:
      "UTI": 0
      "SOL": 1
      "SBU": 2
      "SUB": 3
      "SUF": 4

  # Battery charging priority                                     Uint  331 1 R/W 0: Utility priority, 1: PV priority, 2: PV is at the same level as the Utility, 3: Only PV charging is allowed
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery charging priority"
    use_write_multiple: true
    address: 331
    value_type: U_WORD
    optionsmap:
      #"Utility priority": 0
      "PV priority": 1
      "PV is at the same level as the Utility": 2
      "Only PV charging is allowed": 3

  # Turn on mode                                                  Uint  406 1 R/W 0: Can be turn-on locally or remotely, 1: Only local turn-on, 2: Only remote turn-on
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} turn on mode"
    use_write_multiple: true
    address: 406
    value_type: U_WORD
    optionsmap:
      "Local and remotely turn-on allowed": 0
      "Local turn-on only": 1
      "Remote turn-on only": 2

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${mac_address}
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 5s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "${name_jk} balancing"
    charging:
      name: "${name_jk} charging"
    discharging:
      name: "${name_jk} discharging"
    heating:
      name: "${name_jk} heating"
    online_status:
      name: "${name_jk} online status"
    dry_contact_1:
      name: "${name_jk} dry contact 1"
    dry_contact_2:
      name: "${name_jk} dry contact 2"

button:
  - platform: jk_bms_ble
    retrieve_settings:
      name: "${name_jk} retrieve settings"
    retrieve_device_info:
      name: "${name_jk} retrieve device info"

number:
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} max pv power"
    address: 344
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    min_value: 0
    max_value: 4200
    step: 1
    use_write_multiple: true

  # Max charging voltage                                          0.1V    Uint  324 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} max charging voltage"
    use_write_multiple: true
    address: 324
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Floating charging voltage                                     0.1V    Uint  325 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} floating charging voltage"
    use_write_multiple: true
    address: 325
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery discharge recovery point in mains mode                0.1V    Uint  326 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery discharge recovery point in mains mode"
    use_write_multiple: true
    address: 326
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in mains mode            0.1V    Uint  327 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery low voltage protection point in mains mode"
    use_write_multiple: true
    address: 327
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in off-grid mode          0.1V           Uint  329 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} battery low voltage protection point in off-grid mode"
    use_write_multiple: true
    address: 329
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum charging current                                      0.1A    Uint  332 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} maximum charging current"
    use_write_multiple: true
    address: 332
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum mains charging current                                0.1A    Uint  333 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} maximum mains charging current"
    use_write_multiple: true
    address: 333
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Two equalization charging intervals                           day     Uint  337 1 R/W Range: 1~90
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} two equalization charging intervals"
    use_write_multiple: true
    address: 337
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 90.0
    step: 1
    unit_of_measurement: "day"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Protect Go to SUB"
    use_write_multiple: true
    address: 341
    register_type: holding
    value_type: U_WORD
    min_value: 5.0
    max_value: 50.0
    step: 1
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} Protect return to SBU"
    use_write_multiple: true
    address: 342
    register_type: holding
    value_type: U_WORD
    min_value: 50.0
    max_value: 100.0
    step: 1
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "${name} AC затримка"
    use_write_multiple: true
    address: 355
    register_type: holding
    value_type: U_WORD
    step: 5
    min_value: 5
    max_value: 300
    unit_of_measurement: "s"

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
